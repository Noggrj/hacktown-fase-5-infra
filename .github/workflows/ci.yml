name: CI — fiapx-infra

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Validação estática apenas — nenhum job aqui toca em AWS de verdade
# (sem credenciais, sem terraform plan/apply). "terraform validate" só
# checa sintaxe e referências entre recursos; não precisa de backend
# nem de credenciais configuradas. "docker compose config" valida o
# YAML sem precisar dos 6 repos irmãos no disco (não resolve/baixa os
# build contexts, só interpola variáveis e valida a sintaxe).

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (sem backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose config --quiet
        working-directory: local
