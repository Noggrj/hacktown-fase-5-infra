# Dashboard do Grafana carregado automaticamente pelo sidecar (ver
# grafana.sidecar.dashboards em ../prometheus-values.yaml) — não precisa
# de import manual pela UI a cada `helm install`/`terraform apply` novo.
#
# Painéis usam só as métricas que os 4 serviços Go já expõem de verdade
# em /metrics (internal/platform/metrics em cada repo): http_requests_total
# e http_request_duration_seconds, com o label "app" vindo do relabel
# configurado em prometheus-values.yaml (fiapx-auth, fiapx-video,
# fiapx-worker, fiapx-notification). Nada aqui mede algo que o código
# não emite — sem métrica de negócio inventada (nº de vídeos processados
# etc.) porque esse instrumento específico ainda não existe no código.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fiapx-overview.json: |
    {
      "uid": "fiapx-services-overview",
      "title": "FIAP X — Serviços",
      "tags": ["fiapx"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Serviços no ar",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "count(up{job=\"fiapx-services\"} == 1)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 4 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Taxa de requisições por serviço (req/s)",
          "description": "sum(rate(http_requests_total[5m])) by (app)",
          "gridPos": { "h": 5, "w": 18, "x": 6, "y": 0 },
          "datasource": "Prometheus",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(http_requests_total{job=\"fiapx-services\"}[5m])) by (app)",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Taxa de erro 5xx por serviço (%)",
          "description": "5xx / total, por serviço",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "100 * sum(rate(http_requests_total{job=\"fiapx-services\", status=~\"5..\"}[5m])) by (app) / sum(rate(http_requests_total{job=\"fiapx-services\"}[5m])) by (app)",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Latência p95 por serviço",
          "description": "histogram_quantile(0.95, http_request_duration_seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"fiapx-services\"}[5m])) by (app, le))",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requisições por status HTTP",
          "description": "sum(rate(http_requests_total[5m])) by (status)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "datasource": "Prometheus",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(http_requests_total{job=\"fiapx-services\"}[5m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        }
      ]
    }
